<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clonosaurio</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #f7f7f7;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    #contenedor {
        text-align: center;
    }

    h1 {
        margin-bottom: 10px;
    }

    #juego {
        position: relative;
        width: 800px;
        height: 300px;
        max-width: 95vw;
        border: 3px solid #333;
        background: linear-gradient(180deg, #cdeab0 0%, #e6f5d6 55%, #f3f8ec 100%);
        overflow: hidden;
    }

    /* =========================
       FONDO DE JUNGLA
    ========================= */

    #fondo {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .arbol {
        position: absolute;
        bottom: 43px;
        width: 14px;
        height: 0;
    }

    .arbol::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 5px;
        width: 4px;
        height: 40px;
        background: #6b4423;
        border-radius: 2px;
    }

    .arbol::after {
        content: "";
        position: absolute;
        bottom: 34px;
        left: -10px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #4a7c3c;
        box-shadow:
            -14px 6px 0 -4px #3f6b30,
             14px 4px 0 -4px #578f45,
             0 -8px 0 -6px #63a04d;
    }

    .arbol1 { left: 30px;  transform: scale(0.85); opacity: 0.85; }
    .arbol2 { left: 190px; transform: scale(1.1); }
    .arbol3 { left: 430px; transform: scale(0.9);  opacity: 0.85; }
    .arbol4 { left: 640px; transform: scale(1.15); }
    .arbol5 { left: 730px; transform: scale(0.8); opacity: 0.8; }

    #suelo {
        position: absolute;
        bottom: 40px;
        left: 0;
        width: 100%;
        height: 4px;
        background: #7a5230;
        z-index: 1;
    }

    #suelo::before {
        content: "";
        position: absolute;
        top: -3px;
        left: 0;
        width: 100%;
        height: 3px;
        background: #5c8a3c;
    }

    /* =========================
       T-REX
    ========================= */

    #dino {
        position: absolute;
        left: 80px;
        bottom: 43px;
        width: 62px;
        height: 60px;
        z-index: 2;
    }

    #dino::after {
        /* patas */
        content: "";
        position: absolute;
        width: 9px;
        height: 16px;
        background: #2c4f2c;
        bottom: -14px;
        left: 14px;
        border-radius: 2px;
        box-shadow: 16px 0 #2c4f2c;
    }

    .dino-cuerpo {
        position: absolute;
        width: 32px;
        height: 26px;
        left: 0;
        bottom: 14px;
        background: #3f6b3f;
        border-radius: 50% 60% 40% 50% / 60% 50% 50% 40%;
    }

    .dino-cabeza {
        position: absolute;
        width: 26px;
        height: 20px;
        right: 0;
        top: 2px;
        background: #3f6b3f;
        border-radius: 45% 55% 50% 50% / 55% 60% 40% 45%;
    }

    .dino-mandibula {
        position: absolute;
        width: 16px;
        height: 8px;
        right: -8px;
        top: 14px;
        background: #3f6b3f;
        border-radius: 0 6px 6px 0;
    }

    .dino-mandibula::after {
        /* diente */
        content: "";
        position: absolute;
        right: 0;
        top: 0;
        width: 0;
        height: 0;
        border-left: 4px solid #fff;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
    }

    .dino-ojo {
        position: absolute;
        width: 6px;
        height: 6px;
        right: 8px;
        top: 6px;
        background: #fff;
        border-radius: 50%;
    }

    .dino-ojo::after {
        content: "";
        position: absolute;
        width: 3px;
        height: 3px;
        left: 2px;
        top: 2px;
        background: #111;
        border-radius: 50%;
    }

    .dino-brazo {
        position: absolute;
        width: 10px;
        height: 4px;
        left: 26px;
        bottom: 20px;
        background: #3f6b3f;
        border-radius: 2px;
        transform: rotate(-20deg);
    }

    .dino-cola {
        position: absolute;
        left: -18px;
        bottom: 16px;
        width: 0;
        height: 0;
        border-style: solid;
        border-width: 10px 20px 10px 0;
        border-color: transparent #3f6b3f transparent transparent;
        transform: rotate(15deg);
    }

    /* =========================
       CAZADOR (OBSTÁCULO)
    ========================= */

    #cazador {
        position: absolute;
        right: -40px;
        bottom: 43px;
        width: 36px;
        height: 60px;
        z-index: 2;
    }

    #cazador::after {
        /* piernas */
        content: "";
        position: absolute;
        width: 6px;
        height: 16px;
        background: #3a3a3a;
        bottom: -14px;
        left: 11px;
        border-radius: 2px;
        box-shadow: 8px 0 #3a3a3a;
    }

    .cazador-torso {
        position: absolute;
        width: 18px;
        height: 24px;
        left: 9px;
        bottom: 14px;
        background: #4a5d23;
        border-radius: 4px;
    }

    .cazador-torso::after {
        /* cinturón */
        content: "";
        position: absolute;
        left: 0;
        bottom: 6px;
        width: 100%;
        height: 3px;
        background: #3a3a3a;
    }

    .cazador-cabeza {
        position: absolute;
        width: 14px;
        height: 14px;
        left: 11px;
        top: 6px;
        background: #e0ac69;
        border-radius: 50%;
    }

    .cazador-sombrero {
        position: absolute;
        left: 8px;
        top: 1px;
        width: 18px;
        height: 8px;
        background: #5a4632;
        border-radius: 8px 8px 0 0;
    }

    .cazador-sombrero::after {
        /* ala del sombrero */
        content: "";
        position: absolute;
        left: -4px;
        bottom: 0;
        width: 26px;
        height: 3px;
        background: #5a4632;
        border-radius: 2px;
    }

    .cazador-brazo {
        position: absolute;
        width: 12px;
        height: 5px;
        left: -3px;
        bottom: 25px;
        background: #3a4d1a;
        border-radius: 2px;
        transform: rotate(-8deg);
    }

    .cazador-arma {
        position: absolute;
        width: 26px;
        height: 3px;
        left: -20px;
        bottom: 27px;
        background: #2b2b2b;
        border-radius: 1px;
    }

    .cazador-arma::after {
        /* culata */
        content: "";
        position: absolute;
        right: -6px;
        top: -2px;
        width: 8px;
        height: 7px;
        background: #4a3a20;
        border-radius: 2px;
    }

    #puntos {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 20px;
        font-weight: bold;
        background: rgba(255, 255, 255, 0.75);
        padding: 2px 8px;
        border-radius: 4px;
        z-index: 3;
    }

    #mensaje {
        position: absolute;
        width: 100%;
        top: 105px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
        z-index: 3;
    }

    #mensaje span {
        background: rgba(255, 255, 255, 0.85);
        padding: 8px 16px;
        border-radius: 6px;
        display: inline-block;
    }

    #instrucciones {
        margin-top: 15px;
        color: #555;
    }

    button {
        margin-top: 10px;
        padding: 10px 25px;
        font-size: 16px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        #juego {
            height: 250px;
        }
    }
</style>
</head>

<body>

<div id="contenedor">

    <h1>🦖 Clonosaurio</h1>

    <div id="juego">

        <div id="fondo">
            <div class="arbol arbol1"></div>
            <div class="arbol arbol2"></div>
            <div class="arbol arbol3"></div>
            <div class="arbol arbol4"></div>
            <div class="arbol arbol5"></div>
        </div>

        <div id="puntos">00000</div>

        <div id="mensaje">
            <span>Presiona ESPACIO para comenzar</span>
        </div>

        <div id="dino">
            <div class="dino-cuerpo"></div>
            <div class="dino-cabeza"></div>
            <div class="dino-mandibula"></div>
            <div class="dino-ojo"></div>
            <div class="dino-brazo"></div>
            <div class="dino-cola"></div>
        </div>

        <div id="cazador">
            <div class="cazador-sombrero"></div>
            <div class="cazador-cabeza"></div>
            <div class="cazador-torso"></div>
            <div class="cazador-brazo"></div>
            <div class="cazador-arma"></div>
        </div>

        <div id="suelo"></div>

    </div>

    <div id="instrucciones">
        ESPACIO = Saltar
    </div>

    <button onclick="reiniciar()">Reiniciar</button>

</div>

<script>

const dino = document.getElementById("dino");
const cazador = document.getElementById("cazador");
const puntosTexto = document.getElementById("puntos");
const mensaje = document.getElementById("mensaje");

let jugando = false;
let saltando = false;
let gameOver = false;

let dinoY = 0;
let velocidadY = 0;

let cazadorX = 800;

let puntos = 0;
let velocidad = 6;

let ultimoTiempo = 0;


/* =========================
   SALTO
========================= */

function saltar() {

    if (!jugando) {
        comenzar();
    }

    if (saltando || gameOver)
        return;

    saltando = true;
    velocidadY = 13;
}


/* =========================
   COMENZAR
========================= */

function comenzar() {

    if (gameOver)
        return;

    jugando = true;
    mensaje.style.display = "none";

    ultimoTiempo = performance.now();

    requestAnimationFrame(bucle);
}


/* =========================
   BUCLE PRINCIPAL
========================= */

function bucle(tiempo) {

    if (!jugando)
        return;

    let dt = (tiempo - ultimoTiempo) / 16.67;
    ultimoTiempo = tiempo;

    if (dt > 2)
        dt = 2;


    /* ----- FÍSICA DEL DINOSAURIO ----- */

    if (saltando) {

        dinoY += velocidadY * dt;

        velocidadY -= 0.7 * dt;

        if (dinoY <= 0) {

            dinoY = 0;
            velocidadY = 0;
            saltando = false;

        }
    }

    dino.style.transform =
        `translateY(${-dinoY}px)`;


    /* ----- CAZADOR ----- */

    cazadorX -= velocidad * dt;

    if (cazadorX < -50) {

        cazadorX = 800 + Math.random() * 300;

        puntos++;

        puntosTexto.textContent =
            String(puntos).padStart(5, "0");


        /* Aumentar dificultad */

        if (puntos % 5 === 0) {
            velocidad += 0.7;
        }
    }

    cazador.style.left = cazadorX + "px";


    /* ----- COLISIÓN ----- */

    const dinoRect = dino.getBoundingClientRect();
    const cazadorRect = cazador.getBoundingClientRect();

    const margen = 8;

    const colision =
        dinoRect.right - margen > cazadorRect.left &&
        dinoRect.left + margen < cazadorRect.right &&
        dinoRect.bottom - margen > cazadorRect.top &&
        dinoRect.top + margen < cazadorRect.bottom;


    if (colision) {

        terminar();
        return;
    }


    requestAnimationFrame(bucle);
}


/* =========================
   GAME OVER
========================= */

function terminar() {

    jugando = false;
    gameOver = true;

    mensaje.style.display = "block";

    mensaje.innerHTML =
        "<span>💥 GAME OVER<br>" +
        "<small>Presiona ESPACIO para volver a jugar</small></span>";
}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

    jugando = false;
    saltando = false;
    gameOver = false;

    dinoY = 0;
    velocidadY = 0;

    cazadorX = 800;

    puntos = 0;
    velocidad = 6;

    puntosTexto.textContent = "00000";

    cazador.style.left = cazadorX + "px";

    dino.style.transform = "translateY(0)";

    mensaje.style.display = "block";
    mensaje.innerHTML =
        "<span>Presiona ESPACIO para comenzar</span>";
}


/* =========================
   TECLADO
========================= */

document.addEventListener("keydown", function(e) {

    if (e.code === "Space") {

        e.preventDefault();

        if (gameOver) {
            reiniciar();
            saltar();
        }
        else {
            saltar();
        }
    }
});


/* También permitir clic */

document.getElementById("juego")
    .addEventListener("click", saltar);

</script>

</body>
</html>
